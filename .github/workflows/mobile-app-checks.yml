name: Mobile Flutter checks

on:
  pull_request:
    paths:
      - "mobile_app/**"
      - ".github/workflows/mobile-app-checks.yml"
  push:
    branches:
      - "feature/flutter-one-to-one-screen-parity"
    paths:
      - "mobile_app/**"
      - ".github/workflows/mobile-app-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze, tests and Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        working-directory: mobile_app
        run: flutter pub get
      - name: Analyze
        working-directory: mobile_app
        run: flutter analyze --no-pub
      - name: Run focused and widget tests
        working-directory: mobile_app
        run: flutter test --no-pub
      - name: Build Android debug APK
        working-directory: mobile_app
        run: flutter build apk --debug --no-pub
