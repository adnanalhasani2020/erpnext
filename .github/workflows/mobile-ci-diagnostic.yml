name: Mobile CI Runner Diagnostic

on:
  push:
    branches:
      - feature/flutter-accounting-hr-operations
    paths:
      - ".github/workflows/mobile-ci-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-health:
    name: Verify GitHub-hosted runner and workflow execution
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Report runner environment
        run: |
          echo "GitHub Actions runner started successfully."
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          echo "Commit: ${GITHUB_SHA}"
          uname -a
          git --version
