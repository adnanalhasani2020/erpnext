name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, for example mobile-v0.1.0"
        required: false
        type: string
  push:
    branches:
      - feature/flutter-mobile-foundation
    paths:
      - "mobile_app/lib/**"
      - "mobile_app/test/**"
      - "mobile_app/pubspec.yaml"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: write

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        working-directory: mobile_app
        run: flutter create --platforms=android --org com.adnanalhasani.erpnext --project-name erpnext_mobile .

      - name: Remove Flutter-generated placeholder test
        working-directory: mobile_app
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: mobile_app
        run: flutter analyze --no-pub

      - name: Run widget tests
        working-directory: mobile_app
        run: flutter test --no-pub

      - name: Build installable debug APK
        working-directory: mobile_app
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "APK build attempt ${attempt}/3"
            if flutter build apk --debug --no-pub 2>&1 | tee apk-build.log; then
              exit 0
            fi
            if ! grep -Eqi 'HTTP response code: 50[234]|status code 50[234]|Gateway Time-out|Could not GET' apk-build.log; then
              echo "Build failed for a non-retryable reason."
              exit 1
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Transient dependency download failure; retrying after ${attempt}0 seconds."
              sleep $((attempt * 10))
            fi
          done
          echo "APK build failed after three transient-network retries."
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: erpnext-mobile-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ERPNext Mobile ${{ inputs.release_tag }}
          generate_release_notes: true
          prerelease: true
          files: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
