name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/flutter-mobile-foundation
    tags:
      - "mobile-v*"
    paths:
      - "mobile_app/**"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        working-directory: mobile_app
        run: flutter create --platforms=android --org com.adnanalhasani.erpnext --project-name erpnext_mobile .

      - name: Resolve dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: mobile_app
        run: flutter analyze --no-pub

      - name: Build installable debug APK
        working-directory: mobile_app
        run: flutter build apk --debug --no-pub

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: erpnext-mobile-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          name: ERPNext Mobile ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          files: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
