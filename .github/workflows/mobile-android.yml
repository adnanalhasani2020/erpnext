name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, for example mobile-v0.1.0"
        required: false
        type: string
  pull_request:
    branches:
      - feature/flutter-mobile-foundation
      - feature/flutter-sales-invoice-workflow
    paths:
      - "mobile_app/lib/**"
      - "mobile_app/test/**"
      - "mobile_app/pubspec.yaml"
      - ".github/workflows/mobile-android.yml"
  push:
    branches:
      - feature/flutter-mobile-foundation
      - feature/flutter-sales-invoice-workflow
      - feature/flutter-purchases-stock-workflows
    paths:
      - "mobile_app/lib/**"
      - "mobile_app/test/**"
      - "mobile_app/pubspec.yaml"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: write

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        working-directory: mobile_app
        run: flutter create --platforms=android --org com.adnanalhasani.erpnext --project-name erpnext_mobile .

      - name: Configure Android build repositories and wrapper
        working-directory: mobile_app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          is_kotlin_dsl = settings.exists()
          if not is_kotlin_dsl:
              settings = Path("android/settings.gradle")
          content = settings.read_text()
          marker = "        mavenCentral()"
          mirror = (
              '        maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
              if is_kotlin_dsl else
              '        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }'
          )
          if mirror not in content:
              if marker not in content:
                  raise SystemExit(f"Could not find mavenCentral() in generated {settings}")
              content = content.replace(marker, mirror + "\n" + marker, 1)
              settings.write_text(content)

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          properties = wrapper.read_text()
          properties = properties.replace("-all.zip", "-bin.zip")
          properties = properties.replace(
              "services.gradle.org/distributions/",
              "downloads.gradle.org/distributions/",
          )
          if "networkTimeout=" not in properties:
              properties += "\nnetworkTimeout=120000"
          if "retries=" not in properties:
              properties += "\nretries=3"
          if "retryBackOffMs=" not in properties:
              properties += "\nretryBackOffMs=1000"
          wrapper.write_text(properties)
          PY

      - name: Remove Flutter-generated placeholder test
        working-directory: mobile_app
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: mobile_app
        run: flutter analyze --no-pub

      - name: Run widget tests
        working-directory: mobile_app
        run: flutter test --no-pub

      - name: Build installable debug APK
        working-directory: mobile_app
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "APK build attempt ${attempt}/3"
            if flutter build apk --debug --no-pub 2>&1 | tee apk-build.log; then
              exit 0
            fi
            if ! grep -Eqi 'HTTP response code: 50[234]|status code 50[234]|Gateway Time-out|Could not GET' apk-build.log; then
              echo "Build failed for a non-retryable reason."
              exit 1
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Transient dependency download failure; retrying after ${attempt}0 seconds."
              sleep $((attempt * 10))
            fi
          done
          echo "APK build failed after three transient-network retries."
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: erpnext-mobile-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ERPNext Mobile ${{ inputs.release_tag }}
          generate_release_notes: true
          prerelease: true
          files: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
